### Site Settings ###
title               : Cale Correos | Travel/Coding Portfolio and Blog
description         : >-
                      Caleb (Cale) Correos: Gay Filipino Beast. Stanford grad living in Los Angeles.
                      Software Engineer moonlighting as a travel agent focused on LGBTQ+ travel in East/Southeast Asia and dabbling in raving.
                      
baseurl             : ""            # Change to empty quotes if you are hosting your site at <your-username>.github.io directly
repository          : ccorreos444/ccorreos444.github.io     # Change to <your-username>/<your-username>.github.io (or remove it if you don't need remote projects)
remote_theme        : yousinix/portfolYOU
open_new_tab        : false                    # Opens external URLs in new tab (works for posts, projects and navbar only)


### Plugins ###
plugins:
  - jemoji


### Navbar Settings ###
nav_exclude:                                            # The following paths are excluded from navbar
  - pages/tags.html
  - pages/404.html
  - pages/index.md


### Author Info ###
author:
  name              : Caleb (Cale) Correos
  image             : /assets/cale-correos-landing.jpeg
  behance           : your_username
# dribbble          : your_username
  email             : ccorreos@alumni.stanford.edu
  facebook          : your_username
  github            : your_username
# gitlab            : your_username
  instagram         : calecorreo
# kaggle            : your_username
  linkedin          : your_username
# medium            : your_username
# soundcloud        : your_username
# spotify           : your_username
# stackoverflow     : your_user_id
# tumblr            : your_username.tumblr.com
# twitch            : your_username
# twitter           : your_username
# vimeo             : your_username
# youtube           : your_channel_name
# keybase           : your_username


### Posts ###
permalink: /blog/:title

sass:
  sass_dir: _sass
  style: compressed # or :expanded


### Collections ###
collections:
  projects:
    output: true
    permalink: /projects/:name


### Disqus ###
disqus:
  shortname: your-short-name-disqus                     # Your website Shortname on disqus


### Analytics ###
analytics:
  enabled: false                                        # Set true to enable analytics
  google:
    tracking_id: your-google-tracking-id


### Buy me a coffee ###
# See https://www.buymeacoffee.com/
buymeacoffee:
  enabled: false
  username: your_username
  color: "#007bff"
  message: "Thank you for visiting."                    # Message to be displayed aside from the button for a few seconds.
  description: "Support me on Buy me a coffee!"


### Defaults for collections ###
defaults:
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "page"
  - scope:
      path: ""
      type: "posts"
    values:
      comments: false                                   # Set to true to enable disqus comments


### Exclude from processing ###
exclude:
  - README.md
  - CONTRIBUTING.md
  - LICENSE
  - "*.log"
